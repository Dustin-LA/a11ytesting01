<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>My TODO List</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="visually-hidden" for="todo-input">New task</label>
      <input
        id="todo-input"
        type="text"
        placeholder="What needs to be done?"
        aria-label="New task"
        required
      />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <p id="empty-state" class="empty-state">No tasks yet. Add one above!</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
